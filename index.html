<title>Chapter 4 Analysis Review | English for Mathematics</title>
<style>
  :root{--ink:#162740;--muted:#637184;--accent:#176b65;--accent2:#e6f3ef;--line:#dbe4e9;--bg:#f2f6f8;--paper:#fff;--red:#ac3b35;--green:#177153;--gold:#a46c1f}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.58 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #50a8a0;outline-offset:2px}
  .top{background:#142f40;color:#fff;padding:17px max(20px,calc((100vw - 1190px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{font-weight:750;line-height:1.25}.brand small{display:block;color:#bdced6;font-size:13px;font-weight:500;margin-top:3px}
  .clock{font-variant-numeric:tabular-nums;font-weight:750;padding:7px 12px;border:1px solid #738e9a;border-radius:10px;white-space:nowrap}.clock.alert{color:#ffcca3;border-color:#ffcca3}
  .shell{max-width:1190px;margin:28px auto;padding:0 20px 45px;display:grid;grid-template-columns:minmax(0,1fr) 266px;gap:22px;align-items:start}
  .card,.side{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 24px #24415b0a}
  .card{padding:26px 30px}.side{padding:20px;position:sticky;top:18px}
  h1{font-size:clamp(25px,3vw,34px);line-height:1.18;margin:4px 0 12px}h2{font-size:23px;line-height:1.3;margin:4px 0 15px}h3{font-size:17px;margin:0 0 8px}
  p{margin:0 0 14px}.muted{color:var(--muted)}.eyebrow{color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .lead{font-size:17px;max-width:66ch}.meta{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}.chip{background:#eaf1f4;padding:6px 11px;border-radius:999px;font-weight:650;font-size:14px}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;min-height:44px}.btn:hover{filter:brightness(.93)}
  .btn.secondary{background:#fff;color:var(--accent)}.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}.btn:disabled{opacity:.4;cursor:default}
  .bar{height:9px;border-radius:99px;background:#e8eff1;overflow:hidden;margin:13px 0 19px}.bar span{display:block;height:100%;background:var(--accent);width:0%;transition:width .2s}
  .passage{background:#f4f8f8;border-left:4px solid var(--accent);padding:17px 20px;border-radius:8px;margin:20px 0 24px;white-space:pre-line}
  .question{padding:21px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qhead{display:flex;gap:11px;align-items:flex-start}.qnum{min-width:37px;height:37px;border-radius:10px;background:var(--accent2);color:var(--accent);display:grid;place-items:center;font-weight:800}.stem{font-weight:650;padding-top:4px}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0 48px}.option{border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;min-height:48px}.option:hover{border-color:#87aca9;background:#f9fcfb}.option:has(input:checked){border-color:var(--accent);background:var(--accent2)}.option input{accent-color:var(--accent);margin-top:5px}.letter{font-weight:800;color:var(--accent)}
  .numeric{margin:14px 0 0 48px;max-width:330px;width:calc(100% - 48px);padding:11px 13px;border:1px solid #aebfc7;border-radius:10px}.hint{display:block;margin:6px 0 0 48px;color:var(--muted);font-size:13px}
  .actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:25px;padding-top:20px;border-top:1px solid var(--line)}.actions .right{display:flex;gap:10px;flex-wrap:wrap}
  .pages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.pagebtn{min-height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:750;color:var(--ink)}.pagebtn.active{outline:2px solid var(--accent);outline-offset:1px}.pagebtn.done{background:#e5f4ee;color:#126445}.pagebtn.partial{background:#fff3da;color:#835310}
  .legend{font-size:13px;color:var(--muted);margin:14px 0 0}.sideStat{font-weight:700;margin-bottom:13px}.mobileNav{display:none}
  .resultTop{display:grid;grid-template-columns:150px 1fr;gap:23px;align-items:center;margin:17px 0 22px}.score{border:7px solid #d7ebe3;border-radius:50%;width:150px;height:150px;display:grid;place-content:center;text-align:center;color:var(--green)}.score strong{font-size:39px;line-height:1}.score span{font-weight:700}
  .review{border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.review.ok{border-left:5px solid var(--green)}.review.bad{border-left:5px solid var(--red)}.review.blank{border-left:5px solid var(--gold)}.review b{color:var(--ink)}.review .label{font-weight:800;margin-bottom:7px}.review p{margin:5px 0}.review .explain{background:#f5f8f9;padding:11px;border-radius:8px;margin-top:10px}.resultNav{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.resultNav a{display:inline-block;padding:5px 9px;border-radius:7px;background:#eaf1f4;color:var(--ink);text-decoration:none;font-weight:700}
  .notice{background:#fff8e8;border:1px solid #edd8a3;padding:12px 14px;border-radius:10px;margin:14px 0}.hidden{display:none!important}
  @media(max-width:830px){.shell{grid-template-columns:1fr}.side{position:static;order:-1}.mobileNav{display:inline-block}.side.collapsed .sideBody{display:none}.side.collapsed{padding:10px 16px}.options{grid-template-columns:1fr}.card{padding:21px 18px}.shell{margin:15px auto;gap:12px}.resultTop{grid-template-columns:1fr}.score{width:130px;height:130px}}
  @media(max-width:450px){.top{padding:13px 16px}.brand{font-size:14px}.brand small{font-size:11px}.clock{font-size:14px;padding:5px 8px}.options{margin-left:0}.numeric,.hint{margin-left:0;width:100%}.qhead{gap:8px}}

<script id="quiz-data" type="application/json">[{"title": "Vocabulary, grammar and symbols", "questions": [{"number": 1, "stem": "What is the fixed difference between each term and the preceding term in an arithmetic sequence called?", "type": "choice", "options": ["common ratio", "common difference", "general term", "first term"], "answer": "B", "explanation": "Common difference là công sai: hiệu của một số hạng và số hạng liền trước trong cấp số cộng."}, {"number": 2, "stem": "What is the fixed factor used to obtain each new term from the preceding nonzero term in a geometric sequence called?", "type": "choice", "options": ["common difference", "partial sum", "common ratio", "term number"], "answer": "C", "explanation": "Common ratio là công bội: thừa số cố định nhân với số hạng trước để được số hạng sau."}, {"number": 3, "stem": "A sequence whose terms approach a finite limit is said to be ____.", "type": "choice", "options": ["convergent", "divergent", "unbounded", "periodic"], "answer": "A", "explanation": "Convergent nghĩa là hội tụ đến một giới hạn hữu hạn. Một dãy tuần hoàn không nhất thiết hội tụ."}, {"number": 4, "stem": "A real sequence is bounded above if ____.", "type": "choice", "options": ["every term is positive", "each term exceeds the preceding term", "the terms have no finite limit", "one real number is at least as large as every term"], "answer": "D", "explanation": "Bounded above nghĩa là có một số thực M sao cho mọi số hạng đều ≤ M; không đòi hỏi dãy tăng hay dương."}, {"number": 5, "stem": "What is the process of finding the derivative of a function called?", "type": "choice", "options": ["integration", "factorization", "differentiation", "approximation"], "answer": "C", "explanation": "Differentiation là phép lấy đạo hàm; integration là phép lấy tích phân."}]}, {"title": "Vocabulary, grammar and symbols", "questions": [{"number": 6, "stem": "What is a point on a differentiable curve where the first derivative is zero called?", "type": "choice", "options": ["stationary point", "endpoint", "intercept", "intersection"], "answer": "A", "explanation": "Stationary point là điểm dừng. Đạo hàm tại điểm đó bằng 0; điểm dừng chưa chắc là cực đại hay cực tiểu."}, {"number": 7, "stem": "What is a point on a curve where the concavity changes called?", "type": "choice", "options": ["local maximum", "local minimum", "stationary point", "inflection point"], "answer": "D", "explanation": "Inflection point (cũng viết inflexion point) là điểm uốn, nơi tính lõm của đồ thị thay đổi. Chỉ có f″ = 0 chưa đủ kết luận điểm uốn."}, {"number": 8, "stem": "If F′(x) = f(x) on an interval, what is F called in relation to f?", "type": "choice", "options": ["a derivative", "an antiderivative", "a lower limit", "a difference quotient"], "answer": "B", "explanation": "Antiderivative, còn gọi primitive function, là nguyên hàm: đạo hàm của F bằng f trên khoảng đang xét."}, {"number": 9, "stem": "In a definite integral from a to b, what is a called?", "type": "choice", "options": ["constant of integration", "integrand", "lower limit", "upper limit"], "answer": "C", "explanation": "a là lower limit (cận dưới); b là upper limit (cận trên). Đây là vị trí cận trong kí hiệu, không phải khẳng định a luôn nhỏ hơn b."}, {"number": 10, "stem": "What is the arbitrary constant added to represent all antiderivatives on an interval called?", "type": "choice", "options": ["constant of integration", "common ratio", "upper limit", "stationary value"], "answer": "A", "explanation": "Constant of integration là hằng số tích phân C, dùng biểu diễn họ nguyên hàm F(x) + C."}]}, {"title": "Vocabulary, grammar and symbols", "questions": [{"number": 11, "stem": "In standard sequence notation, how is u₆ read?", "type": "choice", "options": ["u multiplied by six", "the sixth power of u", "u divided by six", "the sixth term of the sequence u"], "answer": "D", "explanation": "Chỉ số 6 chỉ số thứ tự của số hạng: the sixth term, không phải lũy thừa hay phép nhân."}, {"number": 12, "stem": "Which statement correctly reads “the limit of f(x) as x → 2⁻ is 7”?", "type": "choice", "options": ["f(x) approaches seven as x approaches two from the right.", "f(x) approaches seven as x approaches two from the left.", "f(x) equals seven only when x is less than negative two.", "f(x) approaches two as x approaches seven from the left."], "answer": "B", "explanation": "Dấu 2⁻ chỉ x tiến đến 2 từ bên trái, tức qua các giá trị nhỏ hơn 2; không phải tiến đến −2."}, {"number": 13, "stem": "How is f″(x) read?", "type": "choice", "options": ["f squared at x", "the first derivative of f at x", "the second derivative of f at x", "f evaluated at x squared"], "answer": "C", "explanation": "Hai dấu phẩy biểu thị đạo hàm cấp hai (second derivative), không phải bình phương hàm."}, {"number": 14, "stem": "How is dy/dx read in derivative notation?", "type": "choice", "options": ["the derivative of y with respect to x", "the derivative of x with respect to y", "the product of the changes in x and y", "the second derivative of y with respect to x"], "answer": "A", "explanation": "dy/dx là đạo hàm của y theo x: the derivative of y with respect to x."}, {"number": 15, "stem": "How is ∫₁³ (2x + 1) dx read?", "type": "choice", "options": ["The integral from three to one of two x plus one with respect to x.", "The derivative from one to three of two x plus one with respect to x.", "The integral from one to three of two x plus one with respect to y.", "The integral from one to three of two x plus one with respect to x."], "answer": "D", "explanation": "Cận dưới 1, cận trên 3 và dx cho biết lấy tích phân theo x."}]}, {"title": "Vocabulary, grammar and symbols", "questions": [{"number": 16, "stem": "Complete the sentence: “The terms of the sequence converge ____ zero.”", "type": "choice", "options": ["at", "to", "by", "from"], "answer": "B", "explanation": "Cụm đúng là converge to a limit: hội tụ đến một giới hạn."}, {"number": 17, "stem": "Complete the sentence: “Differentiate y with respect ____ x.”", "type": "choice", "options": ["of", "for", "to", "by"], "answer": "C", "explanation": "Cụm chuẩn là with respect to x: theo biến x."}, {"number": 18, "stem": "Complete the sentence: “If f′(x) is positive throughout an interval, f is ____ on that interval.”", "type": "choice", "options": ["increasing", "increase", "increased", "increasingly"], "answer": "A", "explanation": "Increasing là dạng dùng để mô tả hàm tăng; increasingly là trạng từ, không phù hợp sau is trong câu này."}, {"number": 19, "stem": "Complete the sentence: “The region is bounded ____ the curve and the x-axis.”", "type": "choice", "options": ["into", "to", "with", "by"], "answer": "D", "explanation": "Is bounded by nghĩa là được giới hạn bởi."}, {"number": 20, "stem": "Complete the sentence: “An antiderivative can be ____ by differentiation.”", "type": "choice", "options": ["checking", "checked", "checks", "check"], "answer": "B", "explanation": "Bị động can be checked: có thể được kiểm tra bằng cách lấy đạo hàm."}]}, {"title": "Guided cloze test", "questions": [{"number": 21, "stem": "Blank 21", "type": "choice", "options": ["area", "gradient", "ratio", "order"], "answer": "D", "explanation": "Một dãy liệt kê các số hạng theo một thứ tự (order) xác định. Vị trí của từng số hạng có ý nghĩa."}, {"number": 22, "stem": "Blank 22", "type": "choice", "options": ["average", "instantaneous", "constant", "initial"], "answer": "B", "explanation": "Đạo hàm của vị trí theo thời gian cho vận tốc tức thời (instantaneous velocity), khác vận tốc trung bình trên một khoảng thời gian."}, {"number": 23, "stem": "Blank 23", "type": "choice", "options": ["area", "length", "slope", "distance"], "answer": "C", "explanation": "Đạo hàm tại một điểm là slope (hệ số góc) của tiếp tuyến tại điểm đó."}, {"number": 24, "stem": "Blank 24", "type": "choice", "options": ["integration", "differentiation", "factorization", "subtraction"], "answer": "A", "explanation": "Integration dùng để tính đại lượng tích lũy trên một khoảng."}, {"number": 25, "stem": "Blank 25", "type": "choice", "options": ["perimeter", "gradient", "height", "area"], "answer": "D", "explanation": "Với hàm liên tục không âm, tích phân xác định bằng area (diện tích) giữa đồ thị và trục hoành."}], "passage": "Calculus links limiting behaviour with rates of change and accumulated quantities. A sequence lists its terms in a specific (21) ____. For a moving object, the derivative of its position gives its (22) ____ velocity. On a graph, a derivative gives the (23) ____ of the tangent at the point considered. To measure accumulation over an interval, we use (24) ____. If a continuous function is nonnegative throughout that interval, its definite integral equals the (25) ____ between the graph and the horizontal axis. A negative function requires care when interpreting an integral geometrically."}, {"title": "Mathematical language and problems", "questions": [{"number": 26, "stem": "An arithmetic sequence has first term 7 and common difference 4. What is its tenth term?", "type": "choice", "options": ["40", "43", "47", "70"], "answer": "B", "explanation": "Số hạng thứ mười cách số hạng đầu 9 bước: 7 + 9 × 4 = 43."}, {"number": 27, "stem": "The first term of a geometric sequence is 160. Each subsequent term is half the preceding term. What is the fourth term?", "type": "choice", "options": ["80", "40", "20", "10"], "answer": "C", "explanation": "Các số hạng là 160, 80, 40, 20. Fourth term cần ba lần nhân 1/2 từ số hạng đầu."}, {"number": 28, "stem": "As x approaches 3 from the left, f(x) approaches 5. As x approaches 3 from the right, f(x) approaches 8. What can be said about the two-sided limit at 3?", "type": "choice", "options": ["It equals 5.", "It equals 8.", "It equals 6.5.", "It does not exist."], "answer": "D", "explanation": "Hai giới hạn một bên khác nhau (5 và 8), nên giới hạn hai phía không tồn tại; không lấy trung bình hai giá trị."}, {"number": 29, "stem": "A sequence alternates between 2 and −2 forever. Which statement is true?", "type": "choice", "options": ["The sequence has no finite limit.", "The sequence converges to zero.", "The sequence increases without bound.", "The sequence converges to two."], "answer": "A", "explanation": "Dãy dao động giữa hai giá trị khác nhau nên không hội tụ. Dãy vẫn bị chặn; không tăng vô hạn."}, {"number": 30, "stem": "Every term of a sequence is less than 5. Which statement must be true?", "type": "choice", "options": ["The sequence is increasing.", "The sequence is bounded above by 5.", "The sequence converges to 5.", "The sequence is bounded below by zero."], "answer": "B", "explanation": "Mọi số hạng < 5 đảm bảo 5 là một chặn trên. Không đủ dữ kiện về tính đơn điệu, giới hạn hay chặn dưới."}]}, {"title": "Mathematical language and problems", "questions": [{"number": 31, "stem": "A function has values f(2) = 9 and f(5) = 21. What is its average rate of change from x = 2 to x = 5?", "type": "choice", "options": ["3", "12", "4", "6"], "answer": "C", "explanation": "Average rate of change = (21 − 9)/(5 − 2) = 4; chia độ biến thiên đầu ra cho độ biến thiên đầu vào."}, {"number": 32, "stem": "The derivative of a function at x = 1 is −3. What is the slope of the tangent to its graph at that point?", "type": "choice", "options": ["3", "−1/3", "0", "−3"], "answer": "D", "explanation": "Slope of the tangent tại điểm đang xét bằng đạo hàm tại đó, nên bằng −3."}, {"number": 33, "stem": "At a stationary point, f″(x) is positive. By the second derivative test, what type of point is it?", "type": "choice", "options": ["a local minimum", "a local maximum", "necessarily an inflection point", "necessarily an x-intercept"], "answer": "A", "explanation": "Tại điểm dừng có f′ = 0, điều kiện f″ > 0 của phép thử đạo hàm cấp hai cho cực tiểu địa phương."}, {"number": 34, "stem": "A differentiable function has a negative derivative at every point of an open interval. How does the function behave on that interval?", "type": "choice", "options": ["It is constant.", "It is increasing.", "It is decreasing.", "It is always negative."], "answer": "C", "explanation": "Đạo hàm âm trên khoảng cho hàm giảm. Không suy ra giá trị của hàm luôn âm."}, {"number": 35, "stem": "An object has position s(t) = 3t² metres, where t is time in seconds. What is its instantaneous velocity at t = 2 seconds, in metres per second?", "type": "choice", "options": ["6", "12", "3", "24"], "answer": "B", "explanation": "Instantaneous velocity là s′(t) = 6t. Tại t = 2, vận tốc bằng 12 m/s; không dùng vận tốc trung bình."}]}, {"title": "Mathematical language and problems", "questions": [{"number": 36, "stem": "Which function is an antiderivative of f(x) = 6x?", "type": "choice", "options": ["6x² + 5", "6x + 5", "3x + 5", "3x² + 5"], "answer": "D", "explanation": "Đạo hàm của 3x² + 5 bằng 6x. Hằng số 5 biến mất khi lấy đạo hàm."}, {"number": 37, "stem": "A horizontal graph y = 4 lies above the x-axis from x = 1 to x = 4. What is the area between the graph and the x-axis over this interval?", "type": "choice", "options": ["12 square units", "16 square units", "4 square units", "3 square units"], "answer": "A", "explanation": "Miền là hình chữ nhật cao 4, rộng 4 − 1 = 3; diện tích bằng 12 đơn vị vuông."}, {"number": 38, "stem": "A constant function has value −3 on the interval from 0 to 2. What is its definite integral over this interval?", "type": "choice", "options": ["6", "−6", "−3", "0"], "answer": "B", "explanation": "Tích phân có dấu bằng giá trị hàm nhân độ dài khoảng: −3 × 2 = −6. Diện tích hình học tương ứng là 6."}, {"number": 39, "stem": "The definite integral of f from 1 to 4 equals 9. What is the definite integral of the same function from 4 to 1?", "type": "choice", "options": ["9", "0", "−9", "3"], "answer": "C", "explanation": "Đổi thứ tự hai cận làm đổi dấu tích phân: tích phân từ 4 đến 1 bằng −9."}, {"number": 40, "stem": "The definite integral of f from 0 to 2 is 5, and its definite integral from 2 to 5 is 7. What is its definite integral from 0 to 5?", "type": "choice", "options": ["2", "5", "7", "12"], "answer": "D", "explanation": "Tích phân trên hai khoảng kề nhau có tính cộng: tích phân từ 0 đến 5 bằng 5 + 7 = 12."}]}, {"title": "Short answers", "questions": [{"number": 41, "stem": "The first row in a lecture hall has 14 seats. Each successive row has three more seats than the preceding row. How many seats are in the seventh row?", "type": "number", "answer": "32", "explanation": "Có 6 bước tăng từ hàng đầu đến hàng thứ bảy: 14 + 6 × 3 = 32 ghế."}, {"number": 42, "stem": "A sample initially contains 320 units of a substance. The amount remaining is halved after each full hour. How many units remain after three hours?", "type": "number", "answer": "40", "explanation": "After three hours nghĩa là ba lần giảm một nửa: 320 × (1/2)³ = 40 đơn vị."}, {"number": 43, "stem": "For each positive integer n, a sequence term is obtained by dividing two more than five times n by n. What value do the terms approach as n increases without bound?", "type": "number", "answer": "5", "explanation": "Two more than five times n là 5n + 2. Số hạng bằng (5n + 2)/n = 5 + 2/n; khi n tăng vô hạn, 2/n → 0, nên giới hạn là 5."}, {"number": 44, "stem": "A curve has equation y = x² − 3x + 2. What is the slope of its tangent at the point with x-coordinate 4?", "type": "number", "answer": "5", "explanation": "Slope of its tangent là y′(4). Vì y′ = 2x − 3, hệ số góc bằng 2 × 4 − 3 = 5."}, {"number": 45, "stem": "An object has position s(t) = 2t² + t metres at time t seconds. What is its average velocity from t = 1 to t = 3, in metres per second?", "type": "number", "answer": "9", "explanation": "Average velocity = [s(3) − s(1)]/(3 − 1). s(3) = 21 và s(1) = 3, nên vận tốc trung bình bằng 18/2 = 9 m/s."}]}, {"title": "Short answers", "questions": [{"number": 46, "stem": "The function f(x) = −x² + 8x + 1 is defined for all real x. What is its maximum value?", "type": "number", "answer": "17", "explanation": "f′(x) = −2x + 8 = 0 tại x = 4. Vì f(x) = 17 − (x − 4)², giá trị lớn nhất là 17. Câu hỏi yêu cầu giá trị hàm, không phải x = 4."}, {"number": 47, "stem": "An object has velocity v(t) = t² + 2t metres per second at time t seconds. What is its instantaneous acceleration at t = 3, in metres per second squared?", "type": "number", "answer": "8", "explanation": "Acceleration là đạo hàm của velocity: v′(t) = 2t + 2. Tại t = 3, gia tốc bằng 8 m/s²."}, {"number": 48, "stem": "A region is bounded by the graph y = 2x + 1, the x-axis, and the vertical lines x = 0 and x = 3. What is its area, in square units?", "type": "number", "answer": "12", "explanation": "Hàm dương trên [0, 3], nên diện tích là tích phân từ 0 đến 3 của 2x + 1: [x² + x]₀³ = 12."}, {"number": 49, "stem": "The graph y = x − 2 crosses the x-axis at x = 2. What is the total area between the graph and the x-axis from x = 0 to x = 4, in square units?", "type": "number", "answer": "4", "explanation": "Total area cộng hai tam giác có đáy 2, cao 2: 2 × (1/2 × 2 × 2) = 4. Tích phân có dấu trên [0, 4] bằng 0, nhưng diện tích không triệt tiêu."}, {"number": 50, "stem": "An antiderivative F of f(x) = 4x satisfies F(1) = 7. What is F(3)?", "type": "number", "answer": "23", "explanation": "F(x) = 2x² + C. Điều kiện F(1) = 7 cho C = 5; suy ra F(3) = 18 + 5 = 23."}]}]</script>
<script>
(() => {
  'use strict';
  const groups=JSON.parse(document.getElementById('quiz-data').textContent), all=groups.flatMap(g=>g.questions);
  const KEY='analysis-ch4-review-20261007-v1', DURATION=60*60*1000;
  const main=document.getElementById('main'),side=document.getElementById('side'),clock=document.getElementById('clock');
  let state=read(),tick=null;
  function fresh(){return {status:'intro',page:0,answers:{},startedAt:null,submittedAt:null}}
  function read(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&['intro','working','submitted'].includes(v.status)?v:fresh()}catch{return fresh()}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function numFilled(v){return v!==undefined&&String(v).trim()!==''}
  function answered(q){return numFilled(state.answers[q.number])}
  function count(){return all.filter(answered).length}
  function timeLeft(){return Math.max(0,DURATION-(Date.now()-state.startedAt))}
  function clockUpdate(){if(state.status!=='working')return;const left=timeLeft();clock.textContent=`${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left%60000/1000)).padStart(2,'0')}`;clock.classList.toggle('alert',left<300000);if(left===0)submit(true)}
  function go(page){state.page=Math.max(0,Math.min(groups.length-1,page));save();render();window.scrollTo({top:0,behavior:'instant'})}
  function intro(){side.classList.add('hidden');clock.classList.add('hidden');main.innerHTML=`<div class="eyebrow">Practice test</div><h1>Chapter 4 · Analysis</h1><p class="lead">A 50-question review of sequences, limits, derivatives and integrals through mathematical English: vocabulary, symbols, a five-blank passage, word problems and short answers.</p><div class="meta"><span class="chip">50 questions</span><span class="chip">10 pages · 5 questions each</span><span class="chip">60 minutes</span><span class="chip">10 points</span></div><p>Questions 1–40: choose A–D. Questions 41–50: enter a numerical answer. Use a decimal point if needed; do not include units or calculations. Each correct answer earns 0.2 point.</p><p class="muted">Scope: Unit 1 Sequences and Limits; Unit 2 The Derivative; Unit 3 The Integral and Area Problem. A basic calculator may be used.</p><p class="notice">Your work is saved on this browser while you practise. The answer key and explanations appear after submission.</p><button class="btn" id="start">Start the test</button>`;document.getElementById('start').onclick=()=>{state={...fresh(),status:'working',startedAt:Date.now()};save();render()}}
  function sidePanel(){side.classList.remove('hidden');side.classList.add('collapsed');const n=count();side.innerHTML=`<button id="toggleNav" class="btn secondary mobileNav" type="button">Pages and progress ▾</button><div class="sideBody"><h3>Question navigator</h3><div class="sideStat">${n} / 50 answered</div><div class="pages">${groups.map((g,i)=>{const done=g.questions.filter(answered).length;return `<button type="button" class="pagebtn ${i===state.page?'active':''} ${done===5?'done':done?'partial':''}" data-page="${i}" aria-label="Page ${i+1}, ${done} of 5 answered">${i+1}</button>`}).join('')}</div><p class="legend">Green: all answered · Yellow: partially answered</p></div>`;side.querySelector('#toggleNav').onclick=()=>side.classList.toggle('collapsed');side.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(+b.dataset.page))}
  function working(){clock.classList.remove('hidden');clockUpdate();sidePanel();const group=groups[state.page],first=group.questions[0].number;
    main.innerHTML=`<div class="eyebrow">Page ${state.page+1} of 10 · Questions ${first}–${first+4}</div><h2>${esc(group.title)}</h2><p class="muted">Answer each question, then move to another page. You can return before submitting.</p><div class="bar"><span style="width:${count()*2}%"></span></div>${group.passage?`<div class="passage"><strong>Read the passage and complete blanks 21–25.</strong><br>${esc(group.passage)}</div>`:''}${group.questions.map(q=>`<article class="question"><div class="qhead"><div class="qnum">${q.number}</div><div class="stem">${esc(q.stem)}</div></div>${q.type==='choice'?`<div class="options">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="q${q.number}" value="${'ABCD'[i]}" ${state.answers[q.number]==='ABCD'[i]?'checked':''}><span class="letter">${'ABCD'[i]}.</span><span>${esc(o)}</span></label>`).join('')}</div>`:`<input class="numeric" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-number="${q.number}" value="${esc(state.answers[q.number]??'')}" placeholder="Enter your answer" aria-label="Answer for question ${q.number}"><small class="hint">Enter the numerical value only; do not include units or calculations.</small>`}</article>`).join('')}<div class="actions"><button class="btn ghost" id="prev" ${state.page===0?'disabled':''}>← Previous page</button><div class="right"><button class="btn secondary" id="next" ${state.page===9?'disabled':''}>Next page →</button><button class="btn" id="submit">Submit test</button></div></div>`;
    main.querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',e=>{state.answers[+e.target.name.slice(1)]=e.target.value;save();sidePanel();main.querySelector('.bar span').style.width=count()*2+'%'}));
    main.querySelectorAll('[data-number]').forEach(el=>el.addEventListener('input',e=>{state.answers[+e.target.dataset.number]=e.target.value;save();sidePanel();main.querySelector('.bar span').style.width=count()*2+'%'}));
    main.querySelector('#prev').onclick=()=>go(state.page-1);main.querySelector('#next').onclick=()=>go(state.page+1);main.querySelector('#submit').onclick=()=>submit(false);
  }
  function parseNumber(v){let s=String(v??'').trim().replace(/[−–]/g,'-').replace(',','.').replace(/\s+/g,'');if(!s)return null;
    if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return null;return {value:Number(s),fraction:false}}
  function correct(q){const response=state.answers[q.number];if(!numFilled(response))return false;if(q.type==='choice')return response===q.answer;
    const got=parseNumber(response),expected=parseNumber(q.answer);if(!got||!expected)return false;
    return Math.abs(got.value-expected.value)<1e-10}
  function submit(auto){if(state.status!=='working')return;
    const blank=50-count();if(!auto&&blank&&!confirm(`You have ${blank} unanswered question${blank===1?'':'s'}. Submit the test now?`))return;
    if(!auto&&!blank&&!confirm('Submit your answers and view the results?'))return;
    state.status='submitted';state.submittedAt=Date.now();save();render();window.scrollTo({top:0,behavior:'instant'})}
  function results(){clock.classList.add('hidden');side.classList.add('hidden');const right=all.filter(correct).length,blank=50-count();main.innerHTML=`<div class="eyebrow">Practice result</div><h1>Chapter 4 · Analysis</h1><div class="resultTop"><div class="score"><strong>${(right*.2).toFixed(1)}</strong><span>/ 10 points</span></div><div><h2>${right} correct · ${50-right-blank} incorrect · ${blank} blank</h2><p class="muted">Review your answers and the explanations below. Each question is worth 0.2 point.</p><button class="btn secondary" id="restart">Try again</button></div></div><h2>Answer review</h2><div class="resultNav">${groups.map((g,i)=>`<a href="#review-${i*5+1}">${i*5+1}–${i*5+5}</a>`).join('')}</div>${groups.map(g=>`${g.passage?`<div class="passage"><strong>Questions 21–25: shared passage</strong><br>${esc(g.passage)}</div>`:''}${g.questions.map(q=>{const raw=state.answers[q.number],filled=answered(q),ok=correct(q),response=q.type==='choice'&&filled?`${esc(raw)}. ${esc(q.options['ABCD'.indexOf(raw)]??'')}`:esc(filled?raw:'No answer');const key=q.type==='choice'?`${q.answer}. ${esc(q.options['ABCD'.indexOf(q.answer)])}`:esc(q.answer);return `<article class="review ${!filled?'blank':ok?'ok':'bad'}" id="review-${q.number}"><div class="label">Question ${q.number} · ${!filled?'Blank':ok?'Correct':'Incorrect'}</div><p><b>${esc(q.stem)}</b></p><p>Your answer: ${response}</p><p>Correct answer: <strong>${key}</strong></p><p class="explain">${esc(q.explanation)}</p></article>`}).join('')}`).join('')}<div class="actions"><button class="btn secondary" id="restartBottom">Try again</button><a class="btn ghost" href="#main">Back to top ↑</a></div>`;
    const restart=()=>{if(!confirm('Start a new attempt? Your current answers will be cleared on this browser.'))return;state=fresh();save();render();window.scrollTo({top:0,behavior:'instant'})};main.querySelector('#restart').onclick=restart;main.querySelector('#restartBottom').onclick=restart;
  }
  function render(){if(state.status==='working'&&timeLeft()===0){submit(true);return}if(state.status==='intro')intro();else if(state.status==='working')working();else results()}
  render();tick=setInterval(clockUpdate,1000);
})();
</script>
</body>
